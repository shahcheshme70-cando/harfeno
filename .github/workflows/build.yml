name: ساخت فهرست محتوا
on:
  push:
    branches: [main]
    paths: ["content/**", "halls.json", "build.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - run: pip install -q pillow
      - run: python3 build.py
      - name: ذخیرهٔ فهرست و پیش‌نمایش‌ها
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json generated
          git diff --cached --quiet || git commit -m "به‌روزرسانی فهرست محتوا"
          git pull --rebase -q && git push
